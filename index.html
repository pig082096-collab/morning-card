<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#FFE5EC">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./IMG_20261118_144705.png">
    <title>こんねね～！ねっ子早安集點卡</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #FFE5EC 0%, #FFC2D1 50%, #FFE8A3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
        }
        .card-container {
            background: rgba(255, 255, 255, 0.96);
            width: 100%;
            max-width: 430px;
            margin: 12px auto;
            border-radius: 28px;
            padding: 24px 20px;
            box-shadow: 0 12px 30px rgba(255, 117, 143, 0.25);
            border: 3px solid #FF8FA3;
            text-align: center;
        }
        .top-ribbon {
            background: linear-gradient(90deg, #FF758F, #FFB703);
            color: white;
            font-size: 12px;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        h1 { font-size: 22px; color: #D90429; margin-bottom: 6px; text-shadow: 1px 1px 0 #FFE5EC; }
        .subtitle { font-size: 13px; color: #7F5539; margin-bottom: 18px; }
        .auth-box { background: #FFF8E7; border-radius: 16px; padding: 12px; margin-bottom: 16px; }
        .auth-status { color: #7F5539; font-size: 13px; overflow-wrap: anywhere; margin-bottom: 8px; }
        .btn {
            width: 100%; padding: 13px; border: 0; border-radius: 16px; font-size: 15px;
            font-weight: bold; cursor: pointer; transition: transform 0.2s, opacity 0.2s;
            box-shadow: 0 4px 12px rgba(255, 117, 143, 0.25);
        }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { background: #E5E5E5 !important; color: #999 !important; box-shadow: none; cursor: not-allowed; }
        .btn-primary { background: linear-gradient(90deg, #FF758F, #FF8FA3); color: white; margin-bottom: 9px; }
        .btn-neutral { background: #fff; color: #7F5539; border: 1px solid #FFD0D8; box-shadow: none; }
        .btn-success { background: linear-gradient(90deg, #FFB703, #FB8500); color: white; display: none; animation: bounce 1.2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        .notice-banner {
            width: 100%; margin-bottom: 16px; padding: 15px 10px; border-radius: 18px; color: white;
            font-size: clamp(21px, 6vw, 28px); font-weight: 900; line-height: 1.25;
            animation: banner-pulse 1.4s ease-in-out infinite alternate;
        }
        .notice-banner.late { background: linear-gradient(90deg, #D90429, #FF4D6D); }
        .notice-banner.success { background: linear-gradient(90deg, #2A9D5B, #68C587); }
        .notice-banner[hidden] { display: none; }
        @keyframes banner-pulse { to { transform: scale(1.02); } }
        .points-badge { background: #FFF8E7; border: 2px dashed #FFB703; border-radius: 18px; padding: 12px; margin-bottom: 18px; }
        .points-number { font-size: 32px; font-weight: 900; color: #FF758F; }
        .points-label { font-size: 12px; color: #B08968; font-weight: bold; }
        .stamp-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 18px; }
        .stamp-slot {
            aspect-ratio: 1; background: #FFF0F3; border-radius: 16px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; font-size: 14px; color: #FFB3C1; font-weight: bold;
            border: 2px dashed #FFB3C1; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .stamp-slot.checked { background: linear-gradient(135deg, #FFCCD5, #FFF3B0); border: 2px solid #FF758F; color: #D90429; font-size: 22px; transform: scale(1.04) rotate(-3deg); }
        .status-msg { margin-top: 10px; font-size: 13px; font-weight: bold; color: #FF4D6D; min-height: 20px; }
        .community { border-top: 1px solid #FFE0E6; margin-top: 22px; padding-top: 18px; text-align: left; }
        .community h2 { color: #D90429; font-size: 17px; margin-bottom: 5px; }
        .community-intro { color: #7F5539; font-size: 12px; margin-bottom: 10px; }
        .member-list { list-style: none; display: grid; gap: 8px; }
        .member-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #FFF5F6; border-radius: 12px; padding: 10px; font-size: 13px; }
        .member-name { color: #7F5539; font-weight: bold; overflow-wrap: anywhere; }
        .member-progress { color: #D90429; white-space: nowrap; font-weight: bold; }
        .privacy-note { font-size: 11px; color: #9B806E; margin-top: 10px; line-height: 1.5; }
    </style>
</head>
<body>
    <main class="card-container">
        <div class="top-ribbon">🍑 NEKKO MORNING CLUB 🥟</div>
        <h1>こんねね～！早安集點</h1>
        <p class="subtitle">每天 4:00–9:00 簽到，大家的進度會即時同步！</p>

        <section class="auth-box" aria-label="登入狀態">
            <div class="auth-status" id="authStatus">請使用 Google 登入，同步並查看大家的進度。</div>
            <button class="btn btn-primary" id="signInBtn" type="button">使用 Google 登入</button>
            <button class="btn btn-neutral" id="signOutBtn" type="button" hidden>登出</button>
        </section>

        <div class="notice-banner" id="noticeBanner" role="status" aria-live="polite" hidden></div>
        <section class="points-badge" aria-label="我的集點進度">
            <div class="points-number" id="pointsDisplay">0 / 5</div>
            <div class="points-label">🐾 我的ねね印章 🐾</div>
        </section>
        <div class="stamp-grid" id="stampGrid" aria-label="我的五格集點卡"></div>
        <button class="btn btn-primary" id="checkInBtn" type="button" disabled>登入後即可簽到</button>
        <button class="btn btn-success" id="redeemBtn" type="button">🎁 集滿 5 點！兌換禮品卡</button>
        <div class="status-msg" id="statusMsg" aria-live="polite"></div>

        <section class="community" aria-labelledby="communityTitle">
            <h2 id="communityTitle">ねっ子大家的進度</h2>
            <p class="community-intro">登入後可查看所有參與者的集點狀態。</p>
            <ul class="member-list" id="memberList"><li class="member-item">登入後載入共用進度…</li></ul>
            <p class="privacy-note">你的 Google 顯示名稱和集點進度會讓已登入的參與者看見；不會顯示電子郵件。</p>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithRedirect, getRedirectResult, signOut } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
        import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCctQGyKpk3AtM75DZtrKO7pvekDUTqRvI",
            authDomain: "good-morning-f4edd.firebaseapp.com",
            databaseURL: "https://good-morning-f4edd-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "good-morning-f4edd",
            storageBucket: "good-morning-f4edd.firebasestorage.app",
            messagingSenderId: "382853682106",
            appId: "1:382853682106:web:98be66bc263d09ba824383",
            measurementId: "G-HSE0NC2H4C"
        };

        const TOTAL_POINTS = 5;
        const STORAGE_KEY = 'neneWakeUpData';
        const CHECK_IN_START_HOUR = 4;
        const CHECK_IN_DEADLINE_HOUR = 9;
        const STAMP_ICONS = ['🍑', '🥟', '🍑', '🥟', '👑'];
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let userData = { points: 0, lastCheckInDate: '' };
        let unsubscribeUsers = null;
        let usersData = {};
        let requestInProgress = false;

        const signInBtn = document.getElementById('signInBtn');
        const signOutBtn = document.getElementById('signOutBtn');
        const checkInBtn = document.getElementById('checkInBtn');
        const redeemBtn = document.getElementById('redeemBtn');
        const statusMsg = document.getElementById('statusMsg');
        const banner = document.getElementById('noticeBanner');

        function getTodayStr() {
            const now = new Date();
            return `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`;
        }

        function isWithinCheckInHours() {
            const hour = new Date().getHours();
            return hour >= CHECK_IN_START_HOUR && hour < CHECK_IN_DEADLINE_HOUR;
        }

        function renderGrid() {
            const grid = document.getElementById('stampGrid');
            grid.replaceChildren();
            for (let i = 0; i < TOTAL_POINTS; i++) {
                const slot = document.createElement('div');
                slot.className = `stamp-slot ${i < userData.points ? 'checked' : ''}`;
                if (i < userData.points) {
                    slot.textContent = STAMP_ICONS[i];
                } else {
                    slot.append('🐾');
                    const number = document.createElement('span');
                    number.style.fontSize = '10px';
                    number.textContent = String(i + 1);
                    slot.append(number);
                }
                grid.append(slot);
            }
            document.getElementById('pointsDisplay').textContent = `${userData.points} / ${TOTAL_POINTS}`;
            redeemBtn.style.display = userData.points >= TOTAL_POINTS ? 'block' : 'none';
        }

        function renderMemberList() {
            const list = document.getElementById('memberList');
            list.replaceChildren();
            const entries = Object.entries(usersData).sort((a, b) => {
                const nameA = (a[1]?.displayName || 'ねっ子').toLocaleLowerCase();
                const nameB = (b[1]?.displayName || 'ねっ子').toLocaleLowerCase();
                return nameA.localeCompare(nameB);
            });

            if (!entries.length) {
                const empty = document.createElement('li');
                empty.className = 'member-item';
                empty.textContent = '還沒有參與者，來簽下第一個到吧！';
                list.append(empty);
                return;
            }

            for (const [uid, member] of entries) {
                const item = document.createElement('li');
                item.className = 'member-item';
                const name = document.createElement('span');
                name.className = 'member-name';
                name.textContent = `${member?.displayName || 'ねっ子'}${uid === currentUser?.uid ? '（我）' : ''}`;
                const progress = document.createElement('span');
                progress.className = 'member-progress';
                const points = Number.isInteger(member?.points) ? Math.min(Math.max(member.points, 0), TOTAL_POINTS) : 0;
                const checkedToday = member?.lastCheckInDate === getTodayStr();
                const hour = new Date().getHours();
                let state = checkedToday ? '已簽到 ✓' : (hour >= CHECK_IN_DEADLINE_HOUR ? '未簽到' : '尚未簽到');
                if (hour < CHECK_IN_START_HOUR && !checkedToday) state = '尚未開放';
                progress.textContent = `${points}/${TOTAL_POINTS} · ${state}`;
                item.append(name, progress);
                list.append(item);
            }
        }

        function updateStatus() {
            renderGrid();
            banner.hidden = true;
            banner.classList.remove('late', 'success');

            if (!currentUser) {
                checkInBtn.disabled = true;
                checkInBtn.textContent = '登入後即可簽到';
                return;
            }

            const hour = new Date().getHours();
            const checkedToday = userData.lastCheckInDate === getTodayStr();
            if (hour >= CHECK_IN_DEADLINE_HOUR) {
                banner.hidden = false;
                banner.textContent = checkedToday ? '真棒！有好好起床' : '也太晚起床了吧！！！';
                banner.classList.add(checkedToday ? 'success' : 'late');
                checkInBtn.disabled = true;
                checkInBtn.textContent = checkedToday ? '今天已簽到完成囉 ✓' : '今天簽到時間已過';
            } else if (hour < CHECK_IN_START_HOUR) {
                checkInBtn.disabled = true;
                checkInBtn.textContent = '早上 4 點開放簽到';
                statusMsg.textContent = '簽到時間是早上 4 點到 9 點喔！🍑';
            } else if (checkedToday) {
                checkInBtn.disabled = true;
                checkInBtn.textContent = '今天已簽到完成囉 ✓';
                banner.hidden = false;
                banner.textContent = '真棒！有好好起床';
                banner.classList.add('success');
                statusMsg.textContent = '';
            } else {
                checkInBtn.disabled = requestInProgress;
                checkInBtn.textContent = '🍑 こんねね！起床簽到 (+1)';
                if (statusMsg.textContent === '簽到時間是早上 4 點到 9 點喔！🍑') statusMsg.textContent = '';
            }
            renderMemberList();
        }

        function showError(error) {
            console.error(error);
            const code = error?.code || '';
            if (code.includes('permission-denied')) {
                statusMsg.textContent = '資料庫權限不足，請檢查 Realtime Database 規則。';
            } else if (code.includes('auth/unauthorized-domain')) {
                statusMsg.textContent = '登入網域尚未加入 Firebase 授權網域。';
            } else {
                statusMsg.textContent = '連線發生問題，請稍後重試或檢查 Firebase 設定。';
            }
        }

        function loadLegacyData() {
            try {
                const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                return {
                    points: Number.isInteger(parsed?.points) ? Math.min(Math.max(parsed.points, 0), TOTAL_POINTS) : 0,
                    lastCheckInDate: typeof parsed?.lastCheckInDate === 'string' ? parsed.lastCheckInDate : ''
                };
            } catch {
                return { points: 0, lastCheckInDate: '' };
            }
        }

        async function ensureUserRecord(user) {
            const userRef = ref(database, `morningCard/users/${user.uid}`);
            const legacy = loadLegacyData();
            await runTransaction(userRef, (current) => {
                if (current) return current;
                return {
                    points: legacy.points,
                    lastCheckInDate: legacy.lastCheckInDate,
                    displayName: user.displayName || 'ねっ子'
                };
            });
        }

        signInBtn.addEventListener('click', async () => {
            signInBtn.disabled = true;
            statusMsg.textContent = '正在前往 Google 登入…';
            try {
                await signInWithRedirect(auth, provider);
            } catch (error) {
                showError(error);
                signInBtn.disabled = false;
            }
        });

        signOutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
            } catch (error) {
                showError(error);
            }
        });

        checkInBtn.addEventListener('click', async () => {
            if (!currentUser || !isWithinCheckInHours() || userData.lastCheckInDate === getTodayStr() || requestInProgress) {
                updateStatus();
                return;
            }
            requestInProgress = true;
            updateStatus();
            statusMsg.textContent = '簽到同步中…';
            const userRef = ref(database, `morningCard/users/${currentUser.uid}`);
            try {
                const result = await runTransaction(userRef, (current) => {
                    if (!current || current.lastCheckInDate === getTodayStr() || !isWithinCheckInHours()) return;
                    const points = Number.isInteger(current.points) ? Math.min(Math.max(current.points, 0), TOTAL_POINTS) : 0;
                    if (points >= TOTAL_POINTS) return;
                    return { ...current, points: points + 1, lastCheckInDate: getTodayStr() };
                });
                if (result.committed) {
                    statusMsg.textContent = '真棒！有好好起床';
                } else {
                    statusMsg.textContent = '今天已簽到，或目前不在簽到時段內。';
                }
            } catch (error) {
                showError(error);
            } finally {
                requestInProgress = false;
                updateStatus();
            }
        });

        redeemBtn.addEventListener('click', async () => {
            if (!currentUser || userData.points < TOTAL_POINTS || requestInProgress) return;
            if (!window.confirm('確定兌換並開始新一輪集點嗎？')) return;
            requestInProgress = true;
            redeemBtn.disabled = true;
            try {
                const userRef = ref(database, `morningCard/users/${currentUser.uid}`);
                await runTransaction(userRef, (current) => current && current.points >= TOTAL_POINTS
                    ? { ...current, points: 0 }
                    : current);
                statusMsg.textContent = '新一輪集點卡開始囉！繼續加油 🥟';
            } catch (error) {
                showError(error);
            } finally {
                requestInProgress = false;
                redeemBtn.disabled = false;
                updateStatus();
            }
        });

        getRedirectResult(auth).catch(showError);
        onAuthStateChanged(auth, async (user) => {
            if (unsubscribeUsers) {
                unsubscribeUsers();
                unsubscribeUsers = null;
            }
            currentUser = user;
            usersData = {};
            const authStatus = document.getElementById('authStatus');
            signInBtn.hidden = Boolean(user);
            signInBtn.disabled = false;
            signOutBtn.hidden = !user;

            if (!user) {
                userData = { points: 0, lastCheckInDate: '' };
                authStatus.textContent = '請使用 Google 登入，同步並查看大家的進度。';
                document.getElementById('memberList').replaceChildren();
                const item = document.createElement('li');
                item.className = 'member-item';
                item.textContent = '登入後載入共用進度…';
                document.getElementById('memberList').append(item);
                statusMsg.textContent = '';
                updateStatus();
                return;
            }

            authStatus.textContent = `已登入：${user.displayName || 'ねっ子'}`;
            statusMsg.textContent = '正在載入共用進度…';
            try {
                await ensureUserRecord(user);
                if (currentUser?.uid !== user.uid) return;
                unsubscribeUsers = onValue(ref(database, 'morningCard/users'), (snapshot) => {
                    usersData = snapshot.val() || {};
                    userData = usersData[user.uid] || { points: 0, lastCheckInDate: '' };
                    statusMsg.textContent = '';
                    updateStatus();
                }, showError);
            } catch (error) {
                showError(error);
            }
        });

        // 頁面持續開啟時檢查時間，更新簽到開放狀態與大家的簽到結果。
        window.setInterval(updateStatus, 30 * 1000);
    </script>
</body>
</html>
